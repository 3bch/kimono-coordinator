<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>着物コーディネーター</title>
    <style>
      @font-face {
        font-family: "Kaisei Decol";
        font-weight: 700;
        src: url(data:font/woff2;base64,__WOFF2_KaiseiDecol-Bold__) format("woff2");
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1280px;
        height: 854px;
        overflow: hidden;
      }
      body {
        display: flex;
      }
      .mark {
        flex: 0 0 75%;
        background: oklch(0.5 0.13 345);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mark span {
        font-family: "Kaisei Decol", serif;
        font-weight: 700;
        color: oklch(0.98 0.01 350);
        font-size: 84px;
        line-height: 1;
        letter-spacing: 0.02em;
        white-space: nowrap;
      }
      .strip {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .strip div {
        flex: 1;
      }
    </style>
  </head>
  <body>
    <div class="mark"><span>着物コーディネーター</span></div>
    <div class="strip">
      <div style="background: oklch(0.9 0.05 350)"></div>
      <div style="background: oklch(0.55 0.21 12)"></div>
      <div style="background: oklch(0.35 0.09 340)"></div>
      <div style="background: oklch(0.26 0.018 290)"></div>
    </div>
  </body>
</html>
