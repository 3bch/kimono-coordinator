         閉じた線。上の path の内部の線（衿の線・裾上の線・袖の切れ目・右前の隙間）は
         いずれも細長い塗りや 5 単位の隙間で表されており、枠線を引くと 1 本の線が
         2 本の破線になってしまうため、外周だけを通って跨いでいる。
