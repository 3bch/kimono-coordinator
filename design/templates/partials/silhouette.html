<!-- シルエット 7 レイヤー。色は CSS 変数（--c-kimono など）で外から与える。
     未選択のレイヤーは .unset を付けると薄い塗り＋破線の輪郭になる。
     src/components/*Silhouette.tsx の SVG をそのまま写している -->
<div class="silhouette">
  <svg class="layer l-kimono" viewBox="0 0 1000 2000" xmlns="http://www.w3.org/2000/svg">
    <!-- 外周だけを通る 1 本の閉じた線。襟元から右肩・右袖・裾を回り、左袖・左肩を通って
         戻る。下の path の内部の線（衿の線・裾上の線・袖の切れ目・右前の隙間）はいずれも
         細長い塗りや 5 単位の隙間で表されており、そのままでは地や下のレイヤーが透けて
         しまうため、外周だけを通って跨いでいる。首元の V 字は外周の一部なので残る。
         ふだんは本体の下に敷いて内部の隙間を埋める下敷きとして働き、ゴーストのときは
         輪郭そのものになる（枠線を引くと 1 本の線が 2 本の破線になるのを避ける） -->
    <path
      class="kimono-shape"
      d="
      M 0500 0200 L 0650 0000 Q 0830 0053 0900 0200 L 1000 0467 L 1000 1333
      Q 0870 1467 0855 1333 L 0850 1333 L 0820 2000
      L 0180 2000 L 0150 1333 L 0145 1333
      Q 0130 1467 0000 1333 L 0000 0467 L 0100 0200
      Q 0170 0053 0350 0000 L 0495 0200 Z
    "
    />
    <path
      class="kimono-full"
      fill-rule="evenodd"
      fill="var(--c-kimono)"
      d="
      M 0500 0200 L 0650 0000 Q 0830 0053 0900 0200 L 1000 0467 L 1000 1333
      Q 0870 1467 0855 1333 L 0855 1333 L 0855 0467 L 0850 0467 L 0850 1333
      L 0820 2000 L 0300 2000 L 0300 1067 L 0350 0667 L 0380 0360 Z
      M 0495 0200 L 0350 0000 Q 0170 0053 0100 0200 L 0000 0467 L 0000 1333
      Q 0130 1467 0145 1333 L 0145 1333 L 0145 0467 L 0150 0467 L 0150 1333
      L 0180 2000 L 0295 2000 L 0295 1067 L 0345 0667 L 0375 0360 Z
      M 0850 1200 L 0850 1205 L 0150 1205 L 0150 1200 Z
      M 0390 0360 L 0498 0422 L 0767 0060 L 0773 0060 L 0500 0428 L 0470 0735
      L 0429 1067 L 0424 1067 L 0465 0735 L 0496 0426 L 0380 0360 Z
      M 0233 0060 L 0416 0307 L 0413 0311 L 0227 0060 Z
    "
    />
  </svg>
  <svg class="layer l-haneri" viewBox="0 0 1000 2000" xmlns="http://www.w3.org/2000/svg">
    <!-- 外周だけを通る 1 本の閉じた線。衿の外辺（着物の V と重なる側）を左肩から右肩まで
         通り、首側の内辺を戻ってくる。下の 2 枚は 5 単位の隙間で接しており、そのままでは
         左右の境界（奥の衿の下端と手前の衿の内辺）に地が透けるため、そこは通らずに
         跨いでいる。内辺の合流点 494 91 は手前の衿の曲線の途中（t≒0.7）にあたるので、
         そこで曲線を切った制御点に置き換えてある。
         ふだんは下敷き、ゴーストのときは輪郭になる（着物の kimono-shape と同じ） -->
    <path
      class="haneri-shape"
      d="
      M 0350 0000 L 0447 0134 L 0452 0140 L 0495 0200 L 0500 0200 L 0650 0000
      C 0608 0023 0545 0060 0494 0091
      C 0462 0067 0400 0028 0350 0000 Z
    "
    />
    <!-- 奥の衿。手前の衿に隠れるので途中で終わる細い三角になる -->
    <path
      class="haneri-left"
      fill="var(--c-haneri)"
      d="
      M 0350 0000 L 0447 0134 C 0463 0115 0474 0106 0494 0091
      C 0462 0067 0400 0028 0350 0000 Z
    "
    />
    <!-- 手前の衿。V の底まで届く -->
    <path
      class="haneri-right"
      fill="var(--c-haneri)"
      d="
      M 0650 0000 L 0500 0200 L 0495 0200 L 0452 0140
      C 0488 0095 0590 0033 0650 0000 Z
    "
    />
  </svg>
  <svg
    class="layer l-obiage"
    viewBox="0 0 200 300"
    preserveAspectRatio="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <path
      fill="var(--c-obiage)"
      d="
      M 30 92 L 30 87.5 Q 30 85.5, 36 85.5 C 55 85.8, 72 87, 94 87
      C 96.5 85.4, 103.5 85.4, 106 87 C 128 87, 145 85.8, 164 85.5
      Q 170 85.5, 170 87.5 L 170 92 Z
    "
    />
  </svg>
  <svg
    class="layer l-obi"
    viewBox="0 0 200 300"
    preserveAspectRatio="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <rect x="30" y="90" width="140" height="70" fill="var(--c-obi)" />
  </svg>
  <!-- スワイプ中に隣から入ってくる帯。.swiping のときだけ見せる -->
  <svg
    class="layer l-obi-next hidden"
    viewBox="0 0 200 300"
    preserveAspectRatio="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <rect x="30" y="90" width="140" height="70" fill="var(--c-obi-next)" />
  </svg>
  <svg
    class="layer l-obijime"
    viewBox="0 0 200 300"
    preserveAspectRatio="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <rect x="30" y="123" width="140" height="4" fill="var(--c-obijime)" />
  </svg>
  <svg
    class="layer l-obidome"
    viewBox="0 0 200 300"
    preserveAspectRatio="none"
    xmlns="http://www.w3.org/2000/svg"
  >
    <rect x="90" y="117.5" width="20" height="15" fill="var(--c-obidome)" />
  </svg>
  <svg class="layer l-haori" viewBox="0 0 1000 2000" xmlns="http://www.w3.org/2000/svg">
    <!-- 外周だけを通る線。左右それぞれ 1 本の閉じた線になる。下の path では袖と身頃が
         5 単位の隙間で分かれており、そのままでは切れ目から下の着物が透けるため、
         袖の下端で身頃側へ渡って隙間を跨いでいる。
         ふだんは下敷き、「なし」を掴んでいる間は輪郭になる（着物の kimono-shape と同じ） -->
    <path
      class="haori-shape"
      d="
      M 0780 0059 Q 0861 0115 0903 0205 L 1000 0467 L 1000 1360
      Q 0870 1490 0855 1360 L 0850 1360 L 0850 1400 L 0788 1400 Z
      M 0220 0059 Q 0139 0115 0097 0205 L 0000 0467 L 0000 1360
      Q 0130 1490 0145 1360 L 0150 1360 L 0150 1400 L 0212 1400 Z
    "
    />
    <path
      class="haori-full"
      fill-rule="evenodd"
      fill="var(--c-haori)"
      d="
      M 0780 0059 Q 0861 0115 0903 0205 L 1000 0467 L 1000 1360
      Q 0870 1490 0855 1360 L 0855 0480 L 0850 0480 L 0850 1400 L 0788 1400 Z
      M 0220 0059 Q 0139 0115 0097 0205 L 0000 0467 L 0000 1360
      Q 0130 1490 0145 1360 L 0145 0480 L 0150 0480 L 0150 1400 L 0212 1400 Z
    "
    />
  </svg>
  <!-- スワイプ中に隣から入ってくる羽織。.outline-card を付けると
       「なし」を表す輪郭だけの札になる -->
  <svg class="layer l-haori-next hidden" viewBox="0 0 1000 2000" xmlns="http://www.w3.org/2000/svg">
    <path
      class="haori-shape"
      d="
      M 0780 0059 Q 0861 0115 0903 0205 L 1000 0467 L 1000 1360
      Q 0870 1490 0855 1360 L 0850 1360 L 0850 1400 L 0788 1400 Z
      M 0220 0059 Q 0139 0115 0097 0205 L 0000 0467 L 0000 1360
      Q 0130 1490 0145 1360 L 0150 1360 L 0150 1400 L 0212 1400 Z
    "
    />
    <path
      class="haori-full"
      fill-rule="evenodd"
      fill="var(--c-haori-next)"
      d="
      M 0780 0059 Q 0861 0115 0903 0205 L 1000 0467 L 1000 1360
      Q 0870 1490 0855 1360 L 0855 0480 L 0850 0480 L 0850 1400 L 0788 1400 Z
      M 0220 0059 Q 0139 0115 0097 0205 L 0000 0467 L 0000 1360
      Q 0130 1490 0145 1360 L 0145 0480 L 0150 0480 L 0150 1400 L 0212 1400 Z
    "
    />
  </svg>
</div>
