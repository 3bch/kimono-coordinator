<style>
  /* テーマのフォント（見本文のグリフだけにサブセット化して埋め込み） */
  @font-face {
    font-family: "Kaisei Decol";
    font-weight: 400;
    src: url(data:font/woff2;base64,__WOFF2_KaiseiDecol-Regular__) format("woff2");
  }
  @font-face {
    font-family: "Kaisei Decol";
    font-weight: 700;
    src: url(data:font/woff2;base64,__WOFF2_KaiseiDecol-Bold__) format("woff2");
  }
  @font-face {
    font-family: "Zen Maru Gothic";
    font-weight: 400;
    src: url(data:font/woff2;base64,__WOFF2_ZenMaruGothic-Regular__) format("woff2");
  }
  @font-face {
    font-family: "Zen Maru Gothic";
    font-weight: 700;
    src: url(data:font/woff2;base64,__WOFF2_ZenMaruGothic-Bold__) format("woff2");
  }

  /* テーマのトークン（docs/theme.md と design/theme/colors.html が正） */
  :root {
    --background: oklch(0.97 0.013 350);
    --card: oklch(0.99 0.007 350);
    --foreground: oklch(0.26 0.018 290);
    --primary: oklch(0.5 0.13 345);
    --primary-foreground: oklch(0.98 0.01 350);
    --secondary: oklch(0.93 0.02 345);
    --secondary-foreground: oklch(0.32 0.03 320);
    --muted: oklch(0.94 0.016 345);
    --muted-foreground: oklch(0.52 0.025 320);
    --accent: oklch(0.9 0.05 350);
    --accent-foreground: oklch(0.35 0.09 340);
    --destructive: oklch(0.55 0.21 12);
    --border: oklch(0.9 0.018 345);
    --input: oklch(0.9 0.018 345);
    --ring: oklch(0.5 0.13 345);
    --radius: 0.625rem;

    /* 空の表現に使う色。ゴースト（未登録）は薄い塗り＋破線、
       なし（掴んでいる間）は白い面＋青墨の実線。
       ゴーストの塗りが透過なのは、帯揚げ・帯締めのように登録済みのレイヤーへ
       重なるものがあり、下地を 1 つに決め打ちできないため */
    --ghost-fill: oklch(0.96 0.008 345 / 70%);
    --ghost-stroke: oklch(0.62 0.02 330);
    --none-fill: oklch(1 0 0 / 30%);
    --none-stroke: oklch(0.26 0.018 290 / 70%);
  }

  /* ダーク（夜桜）。プレビューでは .dark-vars を付けた要素以下に効かせる。
     なしの 2 つはライトと同じ値なので、ここでは上書きしない */
  .dark-vars {
    --background: oklch(0.21 0.022 295);
    --card: oklch(0.26 0.024 295);
    --foreground: oklch(0.95 0.012 350);
    --primary: oklch(0.8 0.085 350);
    --primary-foreground: oklch(0.26 0.05 340);
    --secondary: oklch(0.31 0.03 320);
    --secondary-foreground: oklch(0.92 0.02 350);
    --muted: oklch(0.3 0.028 310);
    --muted-foreground: oklch(0.72 0.025 330);
    --accent: oklch(0.36 0.05 335);
    --accent-foreground: oklch(0.93 0.03 350);
    --destructive: oklch(0.66 0.19 12);
    --border: oklch(0.95 0.02 350 / 15%);
    --input: oklch(0.95 0.02 350 / 18%);
    --ring: oklch(0.8 0.085 350);
    --ghost-fill: oklch(0.25 0.02 300 / 70%);
    --ghost-stroke: oklch(0.65 0.03 325);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: "Zen Maru Gothic", sans-serif;
    background: var(--background);
    color: var(--foreground);
    padding: 24px;
  }

  h1 {
    font-family: "Kaisei Decol", serif;
    font-weight: 700;
    font-size: 20px;
    margin-bottom: 4px;
  }

  .lead {
    font-size: 12px;
    color: var(--muted-foreground);
    margin-bottom: 20px;
    line-height: 1.8;
  }

  /* カードを横に並べる。1 枚ごとに状態の名前と補足を添える */
  .cards {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    align-items: flex-start;
  }
  .case {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .case > .caption {
    max-width: 300px;
  }
  .caption .name {
    font-size: 13px;
    font-weight: 700;
  }
  .caption .desc {
    font-size: 11px;
    color: var(--muted-foreground);
    line-height: 1.7;
  }

  /* シルエット。KimonoView と同じ 200x400 の比率で重ねる */
  .silhouette {
    position: relative;
    width: 200px;
    height: 400px;
  }
  .layer {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  /* 未登録のカテゴリ（ゴースト）。薄い塗りと破線の輪郭で「ここが埋まっていない」
     ことを示す。祖先に .unset-<部位> を付けると、そのレイヤーだけがゴーストになる。
     濃すぎると登録済みのアイテムに見えてしまうため、地よりわずかに沈む程度にとどめる */
  .unset-haneri .l-haneri path,
  .unset-obiage .l-obiage path,
  .unset-obi .l-obi rect,
  .unset-obijime .l-obijime rect,
  .unset-obidome .l-obidome rect,
  .unset-haori .l-haori path,
  .unset-kimono .l-kimono .k-ghost {
    fill: var(--ghost-fill);
    stroke: var(--ghost-stroke);
    stroke-width: 1.25;
    stroke-dasharray: 4 3;
    vector-effect: non-scaling-stroke;
  }

  /* 輪郭だけで見せるときは、内部の線を持たない外周 1 本の path に差し替える。
     内部の線（衿の線・裾上の線・袖の切れ目・右前の隙間・左右の半襟の境界）は
     細長い塗りや 5 単位の隙間で表されており、そのまま枠線を引くと
     1 本の線が 2 本になってしまう */
  .k-ghost,
  .h-ghost,
  .n-ghost {
    display: none;
  }
  .unset-kimono .l-kimono .k-full,
  .unset-haneri .l-haneri .n-left,
  .unset-haneri .l-haneri .n-right {
    display: none;
  }
  .unset-kimono .l-kimono .k-ghost,
  .unset-haneri .l-haneri .n-ghost {
    display: block;
  }

  /* 「なし」。着けないと選んだ状態なので何も描かない。
     羽織と帯留めだけが持ち、0 点のときもこの状態になる */
  .none-haori .l-haori,
  .none-obidome .l-obidome {
    display: none;
  }

  /* 指が触れている間だけ、なしの領域に面と輪郭を出す。どこを掴んだかが分かり、
     指を離せば消えるので着けていない姿の確認を邪魔しない。白い面は濃い着物で、
     青墨の線は淡い着物で効くので、組み合わせて下地への依存を互いに埋める */
  .touching.none-haori .l-haori,
  .touching.none-obidome .l-obidome {
    display: block;
  }
  .touching.none-haori .l-haori path,
  .touching.none-obidome .l-obidome rect,
  .outline-card .l-haori-next path {
    fill: var(--none-fill);
    stroke: var(--none-stroke);
    stroke-width: 0.75;
    vector-effect: non-scaling-stroke;
  }
  /* 羽織は袖と身頃が分かれているので、こちらも外周 1 本の path に差し替える */
  .touching.none-haori .l-haori .h-full,
  .outline-card .l-haori-next .h-full {
    display: none;
  }
  .touching.none-haori .l-haori .h-ghost,
  .outline-card .l-haori-next .h-ghost {
    display: block;
  }

  .layer.hidden {
    display: none;
  }
</style>
