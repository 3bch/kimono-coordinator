prepare-commit-msg:
  jobs:
    - name: 'Commit Trailer'
      run: './scripts/commit-trailer.sh {1} {2}'

pre-commit:
  jobs:
    - name: 'Fix Lint'
      run: 'pnpm run fix:lint'
      stage_fixed: true
    - name: 'Format'
      run: 'pnpm run fix:format'
      stage_fixed: true
    - name: 'Check'
      run: 'pnpm run check'
