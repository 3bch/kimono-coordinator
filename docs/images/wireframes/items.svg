<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 620" width="470" role="img" aria-label="アイテム一覧画面のワイヤーフレーム">
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  </style>
  <rect width="590" height="620" fill="#ffffff"/>
  <!-- 一覧 -->
  <g transform="translate(10,10)">
    <rect x="6" y="6" width="268" height="548" rx="28" fill="#ffffff" stroke="#2b2b33" stroke-width="2"/>
    <path d="M40,38 L30,46 L40,54" fill="none" stroke="#2b2b33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="140" y="51" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b33">アイテム一覧</text>
    <!-- カテゴリチップ -->
    <g font-size="11" fill="#2b2b33">
      <rect x="20" y="70" width="46" height="26" rx="13" fill="#7a5c9e"/>
      <text x="43" y="87" text-anchor="middle" fill="#ffffff">着物</text>
      <rect x="72" y="70" width="46" height="26" rx="13" fill="#f1f1f4" stroke="#9a9aa4"/>
      <text x="95" y="87" text-anchor="middle">半襟</text>
      <rect x="124" y="70" width="40" height="26" rx="13" fill="#f1f1f4" stroke="#9a9aa4"/>
      <text x="144" y="87" text-anchor="middle">帯</text>
      <rect x="170" y="70" width="56" height="26" rx="13" fill="#f1f1f4" stroke="#9a9aa4"/>
      <text x="198" y="87" text-anchor="middle">帯揚げ</text>
      <text x="242" y="87" font-size="13" fill="#5c5c66">…</text>
    </g>
    <!-- 行: 通常（写真） -->
    <g>
      <rect x="20" y="112" width="240" height="52" rx="10" fill="#ffffff" stroke="#9a9aa4"/>
      <rect x="28" y="120" width="36" height="36" rx="6" fill="#f1f1f4" stroke="#9a9aa4"/>
      <path d="M32,150 L42,137 L49,144 L54,139 L61,150" fill="none" stroke="#9a9aa4" stroke-width="1.5"/>
      <circle cx="38" cy="130" r="3" fill="none" stroke="#9a9aa4" stroke-width="1.5"/>
      <text x="76" y="143" font-size="12" fill="#2b2b33">名前</text>
      <rect x="210" y="128" width="36" height="20" rx="10" fill="#7a5c9e"/>
      <circle cx="237" cy="138" r="7" fill="#ffffff"/>
    </g>
    <!-- 行: 処理中 -->
    <g>
      <rect x="20" y="172" width="240" height="52" rx="10" fill="#ffffff" stroke="#9a9aa4" stroke-dasharray="5 4"/>
      <rect x="28" y="180" width="36" height="36" rx="6" fill="#f1f1f4"/>
      <circle cx="46" cy="198" r="9" fill="none" stroke="#7a5c9e" stroke-width="2.5" stroke-dasharray="11 5" stroke-linecap="round"/>
      <text x="76" y="195" font-size="12" fill="#2b2b33">名前</text>
      <text x="76" y="211" font-size="10" fill="#7a5c9e">処理中…</text>
    </g>
    <!-- 行: 通常（色） -->
    <g>
      <rect x="20" y="232" width="240" height="52" rx="10" fill="#ffffff" stroke="#9a9aa4"/>
      <rect x="28" y="240" width="36" height="36" rx="6" fill="#c9b8d8"/>
      <text x="76" y="263" font-size="12" fill="#2b2b33">名前</text>
      <rect x="210" y="248" width="36" height="20" rx="10" fill="#7a5c9e"/>
      <circle cx="237" cy="258" r="7" fill="#ffffff"/>
    </g>
    <!-- 行: 候補から外し中（薄い・トグル OFF） -->
    <g opacity=".45">
      <rect x="20" y="292" width="240" height="52" rx="10" fill="#ffffff" stroke="#9a9aa4"/>
      <rect x="28" y="300" width="36" height="36" rx="6" fill="#b8c4d8"/>
      <text x="76" y="323" font-size="12" fill="#2b2b33">名前</text>
      <rect x="210" y="308" width="36" height="20" rx="10" fill="#d7d7de" stroke="#9a9aa4"/>
      <circle cx="219" cy="318" r="7" fill="#ffffff" stroke="#9a9aa4"/>
    </g>
    <text x="140" y="368" text-anchor="middle" font-size="11" fill="#5c5c66">薄い行 = 候補から外し中（トグル OFF）</text>
    <text x="140" y="386" text-anchor="middle" font-size="11" fill="#5c5c66">長押しドラッグで並べ替え（＝スワイプ順）</text>
    <text x="140" y="404" text-anchor="middle" font-size="11" fill="#5c5c66">追加は右下の ＋ FAB から（行は末尾に増える）</text>
    <!-- 追加 FAB（タップで 写真 / 色 の 2 択が開いた状態） -->
    <g>
      <rect x="188" y="418" width="64" height="28" rx="14" fill="#ffffff" stroke="#7a5c9e" stroke-width="1.5"/>
      <text x="220" y="437" text-anchor="middle" font-size="11" fill="#2b2b33">色</text>
      <rect x="188" y="452" width="64" height="28" rx="14" fill="#ffffff" stroke="#7a5c9e" stroke-width="1.5"/>
      <text x="220" y="471" text-anchor="middle" font-size="11" fill="#2b2b33">写真</text>
      <circle cx="228" cy="508" r="24" fill="#7a5c9e"/>
      <g stroke="#ffffff" stroke-width="3" stroke-linecap="round">
        <line x1="228" y1="496" x2="228" y2="520"/>
        <line x1="216" y1="508" x2="240" y2="508"/>
      </g>
    </g>
    <text x="140" y="592" text-anchor="middle" font-size="13" fill="#5c5c66">一覧</text>
  </g>
  <!-- 名前の編集と削除 -->
  <g transform="translate(300,10)">
    <rect x="6" y="6" width="268" height="548" rx="28" fill="#ffffff" stroke="#2b2b33" stroke-width="2"/>
    <path d="M40,38 L30,46 L40,54" fill="none" stroke="#2b2b33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="140" y="51" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b33">アイテム一覧</text>
    <g font-size="11" fill="#2b2b33">
      <rect x="20" y="70" width="46" height="26" rx="13" fill="#7a5c9e"/>
      <text x="43" y="87" text-anchor="middle" fill="#ffffff">着物</text>
      <rect x="72" y="70" width="46" height="26" rx="13" fill="#f1f1f4" stroke="#9a9aa4"/>
      <text x="95" y="87" text-anchor="middle">半襟</text>
      <rect x="124" y="70" width="40" height="26" rx="13" fill="#f1f1f4" stroke="#9a9aa4"/>
      <text x="144" y="87" text-anchor="middle">帯</text>
      <rect x="170" y="70" width="56" height="26" rx="13" fill="#f1f1f4" stroke="#9a9aa4"/>
      <text x="198" y="87" text-anchor="middle">帯揚げ</text>
      <text x="242" y="87" font-size="13" fill="#5c5c66">…</text>
    </g>
    <!-- 行: 名前をその場編集中 -->
    <g>
      <rect x="20" y="112" width="240" height="52" rx="10" fill="#ffffff" stroke="#9a9aa4"/>
      <rect x="28" y="120" width="36" height="36" rx="6" fill="#f1f1f4" stroke="#9a9aa4"/>
      <path d="M32,150 L42,137 L49,144 L54,139 L61,150" fill="none" stroke="#9a9aa4" stroke-width="1.5"/>
      <rect x="72" y="124" width="126" height="28" rx="6" fill="#ffffff" stroke="#7a5c9e" stroke-width="1.5"/>
      <text x="80" y="143" font-size="12" fill="#2b2b33">名前</text>
      <line x1="108" y1="130" x2="108" y2="146" stroke="#7a5c9e" stroke-width="1.5"/>
      <rect x="210" y="128" width="36" height="20" rx="10" fill="#7a5c9e"/>
      <circle cx="237" cy="138" r="7" fill="#ffffff"/>
    </g>
    <text x="140" y="188" text-anchor="middle" font-size="11" fill="#5c5c66">名前をタップ → その場で編集</text>
    <!-- 行: スワイプで削除ボタンが出た状態 -->
    <g>
      <rect x="188" y="212" width="64" height="52" rx="10" fill="#c0392b"/>
      <text x="220" y="243" text-anchor="middle" font-size="12" fill="#ffffff">削除</text>
      <rect x="10" y="212" width="170" height="52" rx="10" fill="#ffffff" stroke="#9a9aa4"/>
      <rect x="18" y="220" width="36" height="36" rx="6" fill="#c9b8d8"/>
      <text x="66" y="243" font-size="12" fill="#2b2b33">名前</text>
    </g>
    <text x="140" y="288" text-anchor="middle" font-size="11" fill="#5c5c66">行を横スワイプ → 削除</text>
    <text x="140" y="336" text-anchor="middle" font-size="11" fill="#5c5c66">画像・色の差し替えは無い</text>
    <text x="140" y="352" text-anchor="middle" font-size="11" fill="#5c5c66">（直したいときは削除して追加し直す）</text>
    <text x="140" y="592" text-anchor="middle" font-size="13" fill="#5c5c66">名前の編集と削除</text>
  </g>
</svg>
