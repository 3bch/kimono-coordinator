<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 580" width="235" role="img" aria-label="保存コーデ一覧画面のワイヤーフレーム">
  <style>
    text { font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif; }
  </style>
  <defs>
    <g id="mini-kimono" fill="#f1f1f4" stroke="#9a9aa4" stroke-width="1.5">
      <path d="M40,0 L26,5 L3,12 L0,56 L15,52 L18,42 L19,100 L61,100 L62,42 L65,52 L80,56 L77,12 L54,5 Z"/>
      <rect x="19" y="56" width="42" height="18" fill="#e2e2e8"/>
    </g>
  </defs>
  <rect width="300" height="580" fill="#ffffff"/>
  <g transform="translate(10,10)">
    <rect x="6" y="6" width="268" height="548" rx="28" fill="#ffffff" stroke="#2b2b33" stroke-width="2"/>
    <path d="M40,38 L30,46 L40,54" fill="none" stroke="#2b2b33" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="140" y="51" text-anchor="middle" font-size="15" font-weight="bold" fill="#2b2b33">保存コーデ一覧</text>
    <!-- 行 1 -->
    <g>
      <rect x="20" y="80" width="240" height="72" rx="10" fill="#ffffff" stroke="#9a9aa4"/>
      <use href="#mini-kimono" transform="translate(30,88) scale(0.55)"/>
      <text x="90" y="121" font-size="13" fill="#2b2b33">8/5 のコーデ</text>
      <path d="M3,11 L11,3 L13,5 L5,13 L2,14 Z" transform="translate(228,108)" fill="none" stroke="#5c5c66" stroke-width="1.3" stroke-linejoin="round"/>
    </g>
    <!-- 行 2 -->
    <g>
      <rect x="20" y="160" width="240" height="72" rx="10" fill="#ffffff" stroke="#9a9aa4"/>
      <use href="#mini-kimono" transform="translate(30,168) scale(0.55)"/>
      <text x="90" y="201" font-size="13" fill="#2b2b33">7/28 のコーデ</text>
      <path d="M3,11 L11,3 L13,5 L5,13 L2,14 Z" transform="translate(228,188)" fill="none" stroke="#5c5c66" stroke-width="1.3" stroke-linejoin="round"/>
    </g>
    <!-- 行 3: スワイプで削除ボタンが出た状態 -->
    <g>
      <rect x="188" y="240" width="64" height="72" rx="10" fill="#c0392b"/>
      <text x="220" y="281" text-anchor="middle" font-size="12" fill="#ffffff">削除</text>
      <rect x="10" y="240" width="170" height="72" rx="10" fill="#ffffff" stroke="#9a9aa4"/>
      <use href="#mini-kimono" transform="translate(20,248) scale(0.55)"/>
      <text x="80" y="281" font-size="12" fill="#2b2b33">7/20 のコーデ</text>
    </g>
    <text x="140" y="352" text-anchor="middle" font-size="11" fill="#5c5c66">行タップ → コーディネートに反映して戻る</text>
    <text x="140" y="370" text-anchor="middle" font-size="11" fill="#5c5c66">鉛筆ボタン → 名前をその場で編集（自動名を変更）</text>
    <text x="140" y="388" text-anchor="middle" font-size="11" fill="#5c5c66">行を横スワイプ → 削除</text>
    <text x="140" y="406" text-anchor="middle" font-size="11" fill="#5c5c66">長押しドラッグ → 並べ替え</text>
  </g>
</svg>
